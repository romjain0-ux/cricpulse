<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Cricket Scorecard — CricPulse</title>
  <meta name="description" content="Live cricket scorecard, real-time win probability meter, and match winner predictions." />
  <style>
    :root {
      --bg: #070b14;
      --card: #111827;
      --surface: #1e293b;
      --border: rgba(148, 163, 184, 0.15);
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --green: #22c55e;
      --gold: #f59e0b;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.45;
    }

    .shell {
      max-width: 640px;
      margin: 0 auto;
      padding: 14px 14px 56px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .back-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .streak-pill {
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: var(--gold);
      padding: 5px 11px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .match-meta {
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    .score-line {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 6px 0;
    }

    .team-big { font-size: 1.05rem; font-weight: 800; }
    .runs-big { font-size: 1.15rem; font-weight: 800; font-variant-numeric: tabular-nums; }
    .runs-big span { font-size: 0.82rem; color: var(--muted); font-weight: 500; }

    .status-banner {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.1);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
    }

    /* Win Probability Meter */
    .prob-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .prob-bar {
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      display: flex;
      background: var(--surface);
      margin-bottom: 8px;
    }

    .prob-a { transition: width 0.45s ease; }
    .prob-b { transition: width 0.45s ease; }

    .prob-note {
      font-size: 0.76rem;
      color: var(--muted);
    }

    /* Predict Winner */
    .predict-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .pick-btn {
      background: var(--surface);
      border: 2px solid var(--border);
      color: var(--text);
      padding: 13px 10px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .pick-btn:hover { border-color: var(--accent); }
    .pick-btn.selected {
      background: rgba(34, 197, 94, 0.16);
      border-color: var(--green);
      color: var(--green);
    }

    .share-row {
      display: none;
      gap: 8px;
      flex-wrap: wrap;
    }

    .share-row.show { display: flex; }

    .btn {
      flex: 1;
      border: none;
      border-radius: 11px;
      padding: 11px 14px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
    }

    .btn-ghost {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Scorecard Tables */
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.84rem;
    }

    th, td {
      padding: 8px 4px;
      text-align: right;
      border-bottom: 1px solid var(--border);
      font-variant-numeric: tabular-nums;
    }

    th:first-child, td:first-child { text-align: left; }
    th { color: var(--muted); font-size: 0.74rem; text-transform: uppercase; }
    tr:last-child td { border-bottom: none; }

    .preview-canvas {
      display: none;
      width: 100%;
      border-radius: 14px;
      margin-top: 12px;
      border: 1px solid var(--border);
    }

    .preview-canvas.show { display: block; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a href="/" class="back-link">← All Matches</a>
      <div class="streak-pill">🔥 Streak: <span id="streakCount">0</span></div>
    </header>

    <div id="content">
      <div class="card" style="text-align:center;color:var(--muted);">Loading live scorecard...</div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "cricpulse_predictions_v1";
    let currentMatch = null;
    let currentProb = { a: 50, b: 50 };

    function getMatchId() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("id")) return params.get("id");
      const parts = window.location.pathname.split("/").filter(Boolean);
      return decodeURIComponent(parts[parts.length - 1] || "");
    }

    function loadPredictions() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { streak: 0, bestStreak: 0, picks: {} };
      } catch {
        return { streak: 0, bestStreak: 0, picks: {} };
      }
    }

    function savePredictions(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function oversToBalls(overs) {
      const whole = Math.floor(overs);
      const part = Math.round((overs - whole) * 10);
      return whole * 6 + Math.min(part, 5);
    }

    // Dynamic Win Probability Engine (Runs, Overs, Wickets, Target)
    function calculateWinProbability(match) {
      const [tA, tB] = match.teams;

      if (match.status === "completed" && match.winner) {
        const aWon = match.winner.toLowerCase() === tA.name.toLowerCase();
        return { a: aWon ? 100 : 0, b: aWon ? 0 : 100, note: "Match completed" };
      }

      if (!match.innings || match.innings.length === 0) {
        return { a: 50, b: 50, note: "Match yet to begin" };
      }

      const maxBalls = (match.maxOvers || 20) * 6;
      const latest = match.innings[match.innings.length - 1];
      const ballsBowled = Math.max(1, oversToBalls(latest.overs));
      const ballsLeft = Math.max(0, maxBalls - ballsBowled);
      const wicketsLeft = Math.max(0, 10 - latest.wickets);

      let battingProb = 50;
      let note = "";

      if (match.target && match.innings.length >= 2) {
        // 2nd Innings Chase Formula
        const runsNeeded = Math.max(0, match.target - latest.runs);
        if (runsNeeded === 0) {
          battingProb = 100;
          note = "Target achieved";
        } else if (ballsLeft === 0 || wicketsLeft === 0) {
          battingProb = 0;
          note = "Chase ended";
        } else {
          const rrr = (runsNeeded / ballsLeft) * 6;
          const parRPO = match.maxOvers <= 20 ? 8.5 : 5.6;
          const rateFactor = (parRPO - rrr) * 6.5;
          const wicketFactor = (wicketsLeft - 5) * 4.8;
          const pressure = ballsLeft < 18 && rrr > 11 ? -10 : 0;
          battingProb = Math.round(Math.max(4, Math.min(96, 52 + rateFactor + wicketFactor + pressure)));
          note = `RRR: ${rrr.toFixed(2)} • ${runsNeeded} needed off ${ballsLeft} balls • ${wicketsLeft} wkts in hand`;
        }
      } else {
        // 1st Innings Projection Formula
        const crr = (latest.runs / ballsBowled) * 6;
        const parRPO = match.maxOvers <= 20 ? 8.4 : 5.5;
        const scoreFactor = (crr - parRPO) * 6;
        const wicketFactor = (wicketsLeft - 6) * 3.5;
        battingProb = Math.round(Math.max(15, Math.min(85, 50 + scoreFactor + wicketFactor)));
        note = `CRR: ${crr.toFixed(2)} • Projected: ${Math.round(crr * (match.maxOvers || 20))}`;
      }

      const isTeamABatting = latest.team.toLowerCase() === tA.name.toLowerCase();
      return {
        a: isTeamABatting ? battingProb : 100 - battingProb,
        b: isTeamABatting ? 100 - battingProb : battingProb,
        note
      };
    }

    function generatePredictionCard(match, pickedTeam, prob, streak) {
      const canvas = document.getElementById("shareCanvas");
      canvas.width = 1080;
      canvas.height = 1080;
      const ctx = canvas.getContext("2d");

      // Background gradient
      const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
      grad.addColorStop(0, "#070b14");
      grad.addColorStop(1, "#172554");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 1080, 1080);

      // Accent border
      ctx.strokeStyle = "#38bdf8";
      ctx.lineWidth = 8;
      ctx.strokeRect(40, 40, 1000, 1000);

      // Header
      ctx.fillStyle = "#38bdf8";
      ctx.font = "bold 42px system-ui, sans-serif";
      ctx.fillText("🏏 CRICPULSE PREDICTION", 90, 130);

      // Match Name
      ctx.fillStyle = "#94a3b8";
      ctx.font = "600 34px system-ui, sans-serif";
      ctx.fillText(match.series.toUpperCase(), 90, 210);

      ctx.fillStyle = "#f8fafc";
      ctx.font = "bold 56px system-ui, sans-serif";
      ctx.fillText(`${match.teams[0].name} vs ${match.teams[1].name}`, 90, 290);

      // Pick Box
      ctx.fillStyle = "rgba(34, 197, 94, 0.14)";
      ctx.fillRect(90, 360, 900, 230);
      ctx.strokeStyle = "#22c55e";
      ctx.lineWidth = 4;
      ctx.strokeRect(90, 360, 900, 230);

      ctx.fillStyle = "#86efac";
      ctx.font = "bold 32px system-ui, sans-serif";
      ctx.fillText("MY WINNER PICK", 130, 430);

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 72px system-ui, sans-serif";
      ctx.fillText(pickedTeam.toUpperCase(), 130, 530);

      // Win Probability Bar
      ctx.fillStyle = "#cbd5e1";
      ctx.font = "bold 34px system-ui, sans-serif";
      ctx.fillText(`Live Win Probability: ${match.teams[0].short} ${prob.a}% — ${match.teams[1].short} ${prob.b}%`, 90, 680);

      const barW = 900;
      const aW = Math.round((prob.a / 100) * barW);
      ctx.fillStyle = match.teams[0].color;
      ctx.fillRect(90, 710, aW, 34);
      ctx.fillStyle = match.teams[1].color;
      ctx.fillRect(90 + aW, 710, barW - aW, 34);

      // Streak Badge
      ctx.fillStyle = "#f59e0b";
      ctx.font = "bold 46px system-ui, sans-serif";
      ctx.fillText(`🔥 Current Prediction Streak: ${streak}`, 90, 845);

      // Footer URL
      ctx.fillStyle = "#94a3b8";
      ctx.font = "600 30px system-ui, sans-serif";
      ctx.fillText(`Can you beat my streak? Play at ${window.location.host}`, 90, 960);

      canvas.classList.add("show");
      return canvas;
    }

    function renderMatch(match) {
      currentMatch = match;
      const [tA, tB] = match.teams;

      // Dynamic SEO-friendly title & description
      document.title = `${tA.name} vs ${tB.name} Live Score, Scorecard & Win Probability — CricPulse`;
      const metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute("content", `${tA.name} vs ${tB.name} Live Score: ${match.statusText}. Check live win probability and full scorecard.`);

      const store = loadPredictions();
      document.getElementById("streakCount").textContent = store.streak;
      const existingPick = store.picks[match.id];

      currentProb = calculateWinProbability(match);

      const getInn = (teamName) => match.innings.find((i) => i.team.toLowerCase() === teamName.toLowerCase());
      const innA = getInn(tA.name);
      const innB = getInn(tB.name);

      const batRows = (match.scorecard?.batting || []).map((b) => `
        <tr>
          <td><strong>${b.name}</strong></td>
          <td><strong>${b.runs}</strong></td>
          <td>${b.balls}</td>
          <td>${b.fours}</td>
          <td>${b.sixes}</td>
          <td>${b.sr}</td>
        </tr>
      `).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--muted);">Detailed batting scorecard updates live during play.</td></tr>`;

      const bowlRows = (match.scorecard?.bowling || []).map((b) => `
        <tr>
          <td><strong>${b.name}</strong></td>
          <td>${b.overs}</td>
          <td>${b.maidens}</td>
          <td>${b.runs}</td>
          <td><strong>${b.wickets}</strong></td>
          <td>${b.econ}</td>
        </tr>
      `).join("") || `<tr><td colspan="6" style="text-align:center;color:var(--muted);">Detailed bowling figures update live during play.</td></tr>`;

      document.getElementById("content").innerHTML = `
        <section class="card">
          <div class="match-meta">${match.name} • ${match.venue}</div>
          <div class="score-line">
            <span class="team-big">${tA.name}</span>
            <span class="runs-big">${innA ? `${innA.runs}/${innA.wickets} <span>(${innA.overs} ov)</span>` : `<span>Yet to bat</span>`}</span>
          </div>
          <div class="score-line">
            <span class="team-big">${tB.name}</span>
            <span class="runs-big">${innB ? `${innB.runs}/${innB.wickets} <span>(${innB.overs} ov)</span>` : `<span>Yet to bat</span>`}</span>
          </div>
          <div class="status-banner">${match.statusText}</div>
        </section>

        <section class="card">
          <div class="section-title">
            <span>Win Probability Meter</span>
            <span>Live Model</span>
          </div>
          <div class="prob-labels">
            <span style="color:${tA.color}">${tA.short} ${currentProb.a}%</span>
            <span style="color:${tB.color}">${currentProb.b}% ${tB.short}</span>
          </div>
          <div class="prob-bar">
            <div class="prob-a" style="width:${currentProb.a}%;background:${tA.color}"></div>
            <div class="prob-b" style="width:${currentProb.b}%;background:${tB.color}"></div>
          </div>
          <div class="prob-note">${currentProb.note}</div>
        </section>

        <section class="card">
          <div class="section-title">
            <span>Predict the Winner</span>
            <span>Best Streak: ${store.bestStreak}</span>
          </div>
          <div class="predict-grid">
            <button class="pick-btn ${existingPick?.team === tA.name ? "selected" : ""}" data-team="${tA.name}" data-short="${tA.short}">
              ${existingPick?.team === tA.name ? "✅ " : ""}${tA.name}
            </button>
            <button class="pick-btn ${existingPick?.team === tB.name ? "selected" : ""}" data-team="${tB.name}" data-short="${tB.short}">
              ${existingPick?.team === tB.name ? "✅ " : ""}${tB.name}
            </button>
          </div>
          <div class="share-row ${existingPick ? "show" : ""}" id="shareRow">
            <button class="btn btn-primary" id="downloadCardBtn">📸 Share Prediction Card</button>
            <button class="btn btn-ghost" id="waShareBtn">💬 WhatsApp</button>
          </div>
          <canvas id="shareCanvas" class="preview-canvas"></canvas>
        </section>

        <section class="card">
          <div class="section-title"><span>Batting Scorecard</span></div>
          <table>
            <thead>
              <tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>
            </thead>
            <tbody>${batRows}</tbody>
          </table>
        </section>

        <section class="card">
          <div class="section-title"><span>Bowling Figures</span></div>
          <table>
            <thead>
              <tr><th>Bowler</th><th>O</th><th>M</th><th>R</th><th>W</th><th>Econ</th></tr>
            </thead>
            <tbody>${bowlRows}</tbody>
          </table>
        </section>
      `;

      document.querySelectorAll(".pick-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const data = loadPredictions();
          data.picks[match.id] = {
            team: btn.dataset.team,
            short: btn.dataset.short,
            resolved: false,
            pickedAt: Date.now()
          };
          savePredictions(data);
          renderMatch(match);
          generatePredictionCard(match, btn.dataset.team, currentProb, data.streak);
        });
      });

      const downloadBtn = document.getElementById("downloadCardBtn");
      if (downloadBtn) {
        downloadBtn.addEventListener("click", async () => {
          const data = loadPredictions();
          const pick = data.picks[match.id];
          if (!pick) return;
          const canvas = generatePredictionCard(match, pick.team, currentProb, data.streak);

          canvas.toBlob(async (blob) => {
            const file = new File([blob], `${match.id}-prediction.png`, { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
              try {
                await navigator.share({
                  title: `${tA.name} vs ${tB.name} Prediction`,
                  text: `I picked ${pick.team} to win! 🔥 Streak: ${data.streak}`,
                  files: [file]
                });
                return;
              } catch {}
            }
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${match.id}-prediction.png`;
            link.click();
          });
        });
      }

      const waBtn = document.getElementById("waShareBtn");
      if (waBtn) {
        waBtn.addEventListener("click", () => {
          const data = loadPredictions();
          const pick = data.picks[match.id];
          if (!pick) return;
          const text = encodeURIComponent(
            `🏏 ${tA.name} vs ${tB.name}\nMy Winner Pick: ${pick.team}\nLive Win Prob: ${tA.short} ${currentProb.a}% vs ${tB.short} ${currentProb.b}%\n🔥 Streak: ${data.streak}\nCheck live score: ${window.location.href}`
          );
          window.open(`https://wa.me/?text=${text}`, "_blank");
        });
      }
    }

    async function loadMatch() {
      const id = getMatchId();
      try {
        const res = await fetch(`/api/matches?id=${encodeURIComponent(id)}`);
        if (!res.ok) throw new Error("Not found");
        const json = await res.json();
        renderMatch(json.match);
      } catch {
        document.getElementById("content").innerHTML = `
          <div class="card" style="text-align:center;">
            <p style="margin-bottom:12px;">Match not found.</p>
            <a href="/" class="back-link">Return to Live Scores</a>
          </div>
        `;
      }
    }

    loadMatch();
    setInterval(loadMatch, 30000);
  </script>
</body>
</html>
